name: Compile Standalone Offline HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-single-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Game Files
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Advanced Bundler
        run: npm install -g html-inline

      - name: Prep GameMaker Paths
        # This fixes a GameMaker bug by ensuring local paths resolve flatly inside the single file
        run: |
          sed -i 's|"html5game/"|""|g' index.html 2>/dev/null || true
          sed -i 's|"html5game/"|""|g' production.html 2>/dev/null || true
          if [ -d "html5game" ]; then cp html5game/* .; fi

      - name: Compile Folder Into Standalone HTML
        # Targets index.html and binds all real underlying code maps into it
        run: html-inline -i index.html -o RetroBowl_Offline.html

      - name: Verify File Size
        run: |
          if [ ! -s RetroBowl_Offline.html ] || [ $(stat -c%s RetroBowl_Offline.html) -le 500000 ]; then
            echo "Error: File is missing or too small (engine assets failed to inject)!"
            exit 1
          fi

      - name: Create Offline Release Bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-build-${{ github.run_number }}
          name: Retro Bowl Standalone Offline Build
          draft: false
          prerelease: false
          files: RetroBowl_Offline.html
