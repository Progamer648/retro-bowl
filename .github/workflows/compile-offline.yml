name: Compile Standalone Offline HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-single-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Game Files
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Advanced Bundler
        run: npm install -g html-inline

      - name: Precise Safe-Purge of Bootstrap Link Only
        # This targets ONLY the bad bootstrap link line so the compiler won't crash, keeping the game engine safe
        run: |
          sed -i '\|/bootstrap/|d' index.html 2>/dev/null || true
          sed -i '\|/bootstrap/|d' production.html 2>/dev/null || true

      - name: Prep GameMaker Paths
        run: |
          sed -i 's|"html5game/"|""|g' index.html 2>/dev/null || true
          sed -i 's|"html5game/"|""|g' production.html 2>/dev/null || true
          if [ -d "html5game" ]; then cp html5game/* .; fi

      - name: Compile Folder Into Standalone HTML
        run: html-inline -i index.html -o RetroBowl_Offline.html

      - name: Verify File Size
        run: |
          if [ ! -s RetroBowl_Offline.html ]; then
            echo "Error: RetroBowl_Offline.html is empty!"
            exit 1
          fi

      - name: Create Offline Release Bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-build-${{ github.run_number }}
          name: Retro Bowl Standalone Offline Build
          draft: false
          prerelease: false
          files: RetroBowl_Offline.html
