name: Compile Standalone Offline HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-single-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Game Files
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bundling Engine
        run: npm install -g html-inline

      - name: Remove External Stylesheet Crash Triggers
        # Using | instead of / prevents the command-line engine from crashing on web links
        run: |
          sed -i '\|bootstrapcdn.com|d' index.html
          sed -i '\|googleapis.com|d' index.html

      - name: Compile Folder Into Standalone HTML
        run: html-inline -i index.html -o RetroBowl_Offline.html

      - name: Verify File Size
        run: |
          if [ ! -s RetroBowl_Offline.html ]; then
            echo "Error: RetroBowl_Offline.html is empty!"
            exit 1
          fi

      - name: Create Offline Release Bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-build-${{ github.run_number }}
          name: Retro Bowl Standalone Offline Build
          draft: false
          prerelease: false
          files: RetroBowl_Offline.html
